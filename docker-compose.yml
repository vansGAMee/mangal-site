services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: mangal
      POSTGRES_USER: mangal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    # Порт 5432 НЕ публикуется наружу ради безопасности. Доступ только внутри сети Docker.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangal -d mangal"]
      interval: 5s
      timeout: 3s
      retries: 20

  platform:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      APP_ROLE: web
      PORT: 8080
      DATABASE_URL: postgresql://mangal:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/mangal?schema=public
      DIRECT_URL: postgresql://mangal:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/mangal?schema=public
      LOCAL_MEDIA_ROOT: /app/uploads
    volumes:
      - uploadsdata:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:8080/api/public/catalog\").then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    restart: always
    env_file:
      - .env
    environment:
      PLATFORM_API_URL: http://platform:8080
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/\").then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      platform:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required in .env (e.g. DOMAIN=mycafe.ru)}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - uploadsdata:/app/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      platform:
        condition: service_healthy
      storefront:
        condition: service_healthy

volumes:
  pgdata:
  uploadsdata:
  caddy_data:
  caddy_config:
